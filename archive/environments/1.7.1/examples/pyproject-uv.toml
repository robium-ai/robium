# status: unverified
# source: https://docs.astral.sh/uv/guides/projects/ (fetched via ctx7, astral-sh/uv)
#
# Minimal pyproject.toml for a pure-Python robium project managed with uv.
# Use this shape when the project does NOT need ROS 2 or other system-level
# dependencies; see skills/environments/SKILL.md's decision tree. Generated
# by `uv init` + `uv add`, then hand-trimmed for illustration; re-run
# `uv add`/`uv lock` in a real project rather than copying this verbatim.

[project]
name = "robium-example-agent"
version = "0.1.0"
description = "Example pure-Python ML/robotics project managed with uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Include the `dev` group by default on `uv sync` / `uv run`, so CI and local
# dev use the same environment without extra flags.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
