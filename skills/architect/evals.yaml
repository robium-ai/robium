triggers:
  positive:
    - phrase: Show me a few robots in MuJoCo I can control and interact with.
    - phrase: Run a pretrained reinforcement-learning policy for autonomous driving in Gymnasium's CarRacing simulation.
    - phrase: Show me a simulated Stack-chan robot with local speech-to-text, text-to-speech, and face tracking.
    - phrase: Map a simulated house with ROS 2, Gazebo, and SLAM, then navigate the robot to a goal.
    - phrase: Help me map a simulated environment with a TurtleBot, localize on the saved map, and navigate to a goal.
    - phrase: Help me control a simulated TurtleBot with Gemini using natural-language instructions.
    - phrase: Help me run a pretrained ACT policy that transfers a cube between two simulated robot arms.
    - phrase: I want to start a robotics project but this machine cannot run the closest example. Help me choose a compatible first slice.
    - phrase: we'll create a new TurtleBot3 application that does not exist yet. Before any live-demo or publishing work, help brainstorm the architecture, choose the stack, and plan the cheapest navigation-only first slice; teleoperation, camera transfer, and mapping come later.
      source: 2026-08-02
    - phrase: we are changing this arm application from scripted control to a VLA and need to rethink the architecture
  negative:
    - phrase: In our existing robot-navigation app, Nav2 plans a path but the robot never receives velocity commands. Diagnose it.
      expect: navigation
    - phrase: Our existing Gemini robot assistant stalls after a navigate function call. Fix the tool response handling.
      expect: gemini-robotics
    - phrase: Inspect the processor files in our existing LeRobot checkpoint before evaluating it.
      expect: lerobot
    - phrase: fix the existing gateway CORS allowlist for our production frontend
      expect: integration
    - phrase: diagnose why this existing ROS 2 node misses messages
      expect: ros2
tasks: []
