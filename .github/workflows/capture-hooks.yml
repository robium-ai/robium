name: capture-hooks

on:
  push:
    branches: [main]
    paths:
      - "hooks/**"
      - "tests/engine/test_hook_launcher.py"
      - "tests/engine/test_hook_scripts.py"
      - "tests/engine/test_miner.py"
      - "tests/engine/test_scrub.py"
      - "tests/engine/test_session_end.py"
      - "tests/engine/test_gemini_hooks.py"
      - "tests/engine/test_cursor_hooks.py"
      - "hooks/scripts/gemini_hook.mjs"
      - "hooks/scripts/cursor_hook.mjs"
      - ".github/workflows/capture-hooks.yml"
  pull_request:
    paths:
      - "hooks/**"
      - "tests/engine/test_hook_launcher.py"
      - "tests/engine/test_hook_scripts.py"
      - "tests/engine/test_miner.py"
      - "tests/engine/test_scrub.py"
      - "tests/engine/test_session_end.py"
      - "tests/engine/test_gemini_hooks.py"
      - "tests/engine/test_cursor_hooks.py"
      - "hooks/scripts/gemini_hook.mjs"
      - "hooks/scripts/cursor_hook.mjs"
      - ".github/workflows/capture-hooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - name: Test capture hooks
        run: >-
          python -m pytest
          tests/engine/test_scrub.py
          tests/engine/test_hook_scripts.py
          tests/engine/test_session_end.py
          tests/engine/test_hook_launcher.py
          tests/engine/test_gemini_hooks.py
          tests/engine/test_cursor_hooks.py
          tests/engine/test_miner.py
          -q
