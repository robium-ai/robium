name: cli

# The robium-ai CLI's test suite plus a catalog drift guard. cli/src/catalog.json
# is generated from skills/ by scripts/build-catalog.mjs but only regenerated by
# hand at release time, so it silently falls behind the plugin whenever a skill
# is added/bumped without a CLI republish (this is what shipped a stale 21-skill
# catalog — see #69/#68). Fail the build if the committed catalog is not a fresh
# generation from the current skills/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + catalog freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero runtime/dev dependencies — nothing to install; `node --test` runs
      # the suite directly.
      - name: Test
        run: npm test

      # Regenerate the bundled catalog from the plugin at the repo root and fail
      # if it differs from what's committed. Keeps `npx robium-ai skills` honest.
      - name: Catalog is fresh
        run: |
          npm run build:catalog
          git diff --exit-code src/catalog.json \
            || { echo "::error::cli/src/catalog.json is stale — run 'npm run build:catalog' in cli/ and commit the result"; exit 1; }
